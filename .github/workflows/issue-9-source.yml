name: Diagnose Issue 9 EventBus formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Export Rust formatting diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply patch and inspect formatting
        shell: bash
        run: |
          cat .github/issue9-patch/part-* > /tmp/issue9.patch
          git apply --check /tmp/issue9.patch
          git apply /tmp/issue9.patch
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml > /tmp/fmt.log 2>&1 || true
          git diff > /tmp/formatted.diff

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue-9-format-diagnostics
          path: |
            /tmp/fmt.log
            /tmp/formatted.diff
          if-no-files-found: error
