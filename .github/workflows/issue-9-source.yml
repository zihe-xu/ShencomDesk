name: Diagnose Issue 9 EventBus patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Export assembled patch diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Assemble and inspect patch
        shell: bash
        run: |
          cat .github/issue9-patch/part-* > /tmp/issue9.patch
          sha256sum /tmp/issue9.patch > /tmp/sha256.txt
          git apply --check /tmp/issue9.patch > /tmp/apply.log 2>&1 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue-9-patch-diagnostics
          path: |
            /tmp/issue9.patch
            /tmp/apply.log
            /tmp/sha256.txt
          if-no-files-found: error
