name: Signed desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: signed-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate versions, tag, updater config, and signing material
        id: validate
        env:
          SHENDESK_UPDATER_PUBLIC_KEY: ${{ vars.SHENDESK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          APPLE_CERTIFICATE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE_PASSWORD_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APPLE_SIGNING_IDENTITY_CONFIGURED: ${{ vars.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_ID_CONFIGURED: ${{ secrets.APPLE_ID != '' }}
          APPLE_PASSWORD_CONFIGURED: ${{ secrets.APPLE_PASSWORD != '' }}
          APPLE_TEAM_ID_CONFIGURED: ${{ vars.APPLE_TEAM_ID != '' }}
        run: node .github/scripts/validate-release.mjs

  release:
    name: Build ${{ matrix.name }}
    needs: preflight
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Each job merges its platform into the release-level latest.json.
      # Serialize jobs to avoid concurrent read/delete/upload races.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            runner: macos-26
            target: aarch64-apple-darwin
            officecli_arch: arm64
            # Tauri's macOS updater signs the app bundle archive. Building only
            # the DMG succeeds but produces no updater archive or signature.
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          - name: macOS Intel DMG
            runner: macos-26-intel
            target: x86_64-apple-darwin
            officecli_arch: x86_64
            args: --target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          - name: Windows x64 MSI
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles msi --config src-tauri/tauri.release.conf.json

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned OfficeCLI sidecar
        run: pnpm officecli:build -- --target ${{ matrix.target }}

      - name: Generate macOS application icons
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm run tauri icon app-icons/logo-macos.svg

      - name: Generate Windows application icons
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm run tauri icon app-icons/logo-windows.svg

      - name: Build, verify, and upload macOS release assets
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHENDESK_UPDATER_PUBLIC_KEY: ${{ vars.SHENDESK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_APP_PATH: src-tauri/target/${{ matrix.target }}/release/bundle/macos/ShenDesk.app
          OFFICECLI_EXPECTED_ARCH: ${{ matrix.officecli_arch }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ShenDesk ${{ github.ref_name }}
          releaseBody: Signed ShenDesk desktop installers and Tauri updater metadata.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          retryAttempts: 2
          # tauri-action uploads only after this script builds and verifies the
          # signed, notarized final app, so failed smoke tests publish nothing.
          tauriScript: ${{ github.workspace }}/.github/scripts/build-verify-macos-release.sh
          args: ${{ matrix.args }}

      - name: Build, sign, and upload Windows updater release assets
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHENDESK_UPDATER_PUBLIC_KEY: ${{ vars.SHENDESK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ShenDesk ${{ github.ref_name }}
          releaseBody: Signed ShenDesk desktop installers and Tauri updater metadata.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          retryAttempts: 2
          args: ${{ matrix.args }}
