name: TaskManager format artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Format TaskManager Rust sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-formatted-rust
          path: |
            apps/desktop/src-tauri/build.rs
            apps/desktop/src-tauri/src/**/*.rs
          if-no-files-found: error
