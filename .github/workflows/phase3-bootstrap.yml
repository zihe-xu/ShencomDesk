name: Phase 3 source bootstrap

on:
  push:
    branches:
      - feat/issue-12-plugin-system

permissions:
  contents: write

concurrency:
  group: phase3-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Materialize and format plugin source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-12-plugin-system
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase3-payload/part-* | base64 --decode > /tmp/phase3-plugin.tar.gz
          tar -xzf /tmp/phase3-plugin.tar.gz -C .

      - name: Format Rust and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Remove bootstrap transport
        shell: bash
        run: |
          rm -rf .phase3-payload
          rm -f .github/workflows/phase3-bootstrap.yml

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 0
          fi
          git commit -m "feat: implement sandboxed plugin system"
          git push origin HEAD:feat/issue-12-plugin-system
