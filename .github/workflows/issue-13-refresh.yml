name: Issue 13 dependency refresh

on:
  push:
    branches:
      - feat/issue-13-auto-update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-13-dependency-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-13-auto-update
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit deterministic dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src apps/desktop/src-tauri/build.rs
          if git diff --cached --quiet; then
            echo "Formatting and lockfile are already current."
            exit 0
          fi
          git commit -m "chore: format updater code and refresh Cargo lockfile"
          git push origin HEAD:feat/issue-13-auto-update
