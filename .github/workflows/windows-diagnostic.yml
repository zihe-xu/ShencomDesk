name: Export Tauri desktop icons

on:
  push:
    branches:
      - ci/issue-37-windows-diagnostic
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-tauri-icons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-icons:
    name: Export generated icons
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Tauri desktop icons
        working-directory: apps/desktop
        run: npm run tauri -- icon app-icon.svg

      - name: Upload generated icon set
        uses: actions/upload-artifact@v4
        with:
          name: shendesk-tauri-icons-${{ github.sha }}
          path: apps/desktop/src-tauri/icons
          if-no-files-found: error
          retention-days: 1
