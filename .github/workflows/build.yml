name: Post-merge desktop build

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-desktop-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build decision
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      build_sha: ${{ steps.decision.outputs.build_sha }}
      short_sha: ${{ steps.decision.outputs.short_sha }}
      pr_number: ${{ steps.decision.outputs.pr_number }}
      trigger: ${{ steps.decision.outputs.trigger }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Resolve trigger and target commit
        id: decision
        env:
          SKIP_BUILD_LABEL: skip-build
        run: node .github/scripts/resolve-post-merge-build.mjs

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            artifact_key: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
            officecli_arch: arm64
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app
          - platform: macOS Intel
            artifact_key: macos-x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
            officecli_arch: x86_64
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app
          - platform: Windows
            artifact_key: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pinned OfficeCLI sidecar
        run: pnpm officecli:build -- --target ${{ matrix.target }}

      - name: Generate macOS application icons
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: pnpm run tauri icon app-icons/logo-macos.svg

      - name: Generate Windows application icons
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm run tauri icon app-icons/logo-windows.svg

      - name: Build Tauri desktop bundles
        id: tauri_build
        working-directory: apps/desktop
        run: node ../../.github/scripts/run-tauri-build.mjs

      - name: Verify bundled OfficeCLI in macOS app
        if: runner.os == 'macOS'
        run: >-
          node .github/scripts/verify-officecli-install.mjs
          --root apps/desktop/src-tauri/target/release/bundle/macos/ShenDesk.app/Contents/MacOS
          --resources apps/desktop/src-tauri/target/release/bundle/macos/ShenDesk.app/Contents/Resources
          --expected-arch ${{ matrix.officecli_arch }}

      - name: Install MSI and verify bundled OfficeCLI
        if: runner.os == 'Windows'
        run: node .github/scripts/verify-officecli-windows-msi.mjs apps/desktop/src-tauri/target/release/bundle/msi

      - name: Upload failed build diagnostics
        id: diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shendesk-${{ matrix.artifact_key }}-${{ needs.prepare.outputs.short_sha }}-diagnostics
          path: apps/desktop/tauri-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload desktop bundles
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: shendesk-${{ matrix.artifact_key }}-${{ needs.prepare.outputs.short_sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_SHA: ${{ needs.prepare.outputs.build_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          TRIGGER: ${{ needs.prepare.outputs.trigger }}
          ARTIFACT_NAME: shendesk-${{ matrix.artifact_key }}-${{ needs.prepare.outputs.short_sha }}
          DIAGNOSTICS_NAME: shendesk-${{ matrix.artifact_key }}-${{ needs.prepare.outputs.short_sha }}-diagnostics
          BUILD_OUTCOME: ${{ steps.tauri_build.outcome || 'not-run' }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome || 'not-run' }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome || 'not-run' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## ${PLATFORM} 构建结果"
            echo
            echo "| 字段 | 值 |"
            echo "| --- | --- |"
            echo "| 触发方式 | ${TRIGGER} |"
            echo "| PR | ${PR_NUMBER} |"
            echo "| 提交 SHA | ${BUILD_SHA} |"
            echo "| 平台 | ${PLATFORM} |"
            echo "| 构建步骤 | ${BUILD_OUTCOME} |"
            echo "| 产物上传 | ${ARTIFACT_OUTCOME} |"
            echo "| Artifact | ${ARTIFACT_NAME} |"
            echo "| 诊断日志上传 | ${DIAGNOSTICS_OUTCOME} |"
            echo "| 诊断 Artifact | ${DIAGNOSTICS_NAME} |"
            echo "| Job 状态 | ${JOB_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"
