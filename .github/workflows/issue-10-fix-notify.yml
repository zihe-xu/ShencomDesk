name: Fix Issue 10 notify callback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    name: Fix and format notify callback
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/issue-10-file-service'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply callback type fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/infrastructure/filesystem/mod.rs")
          source = path.read_text()
          old = "let mut watcher = notify::recommended_watcher(move |result| match result {"
          new = "let mut watcher = notify::recommended_watcher(\n            move |result: notify::Result<notify::Event>| match result {"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one untyped notify callback")
          path.write_text(source.replace(old, new))
          PY
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          rm -f .github/workflows/issue-10-fix-notify.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: type notify watcher callback"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
