name: Phase 3 Auto Update source bootstrap

on:
  push:
    branches:
      - feat/issue-13-auto-update

permissions:
  contents: write

concurrency:
  group: phase3-update-bootstrap-feat-issue-13
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Recover complete files from Auto Update payload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-13-auto-update
          fetch-depth: 0

      - name: Detect payload
        id: payload
        shell: bash
        run: |
          if compgen -G '.phase3-update-payload/part-*' > /dev/null; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Bootstrap payload has already been consumed."
          fi

      - name: Recover complete leading archive entries
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -u
          cat .phase3-update-payload/part-* | base64 --decode > /tmp/phase3-update.tar.gz 2>/dev/null || true
          tar -xzf /tmp/phase3-update.tar.gz -C . 2>/dev/null || true

          for required in \
            .github/scripts/validate-release.mjs \
            .github/scripts/validate-release.test.mjs \
            .github/workflows/release.yml \
            docs/auto-update.md; do
            if [[ ! -s "${required}" ]]; then
              echo "recovered file is missing or empty: ${required}"
              exit 1
            fi
          done

          mkdir -p .github/recovered
          cp .github/workflows/release.yml .github/recovered/release.yml.txt
          rm -f .github/workflows/release.yml

      - name: Remove consumed payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: rm -rf .phase3-update-payload

      - name: Commit recovered release infrastructure
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: add signed update release infrastructure"
          git push origin HEAD:feat/issue-13-auto-update
