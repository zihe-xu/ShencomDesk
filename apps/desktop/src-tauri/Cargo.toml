[package]
name = "shendesk"
version = "0.1.0"
description = "Shencom Desktop Platform"
authors = ["Shencom"]
edition = "2021"

[lib]
name = "shendesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
moka = { version = "0.12", features = ["sync"] }
notify = "8"
oxipng = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
wasmtime = { version = "47.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
wat = "1"
